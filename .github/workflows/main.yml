name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.environment }} / Python 3.14
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [py314, docs, lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'tox>=4,<5'

      - name: Run tests
        run: python -m tox -e ${{ matrix.environment }}
