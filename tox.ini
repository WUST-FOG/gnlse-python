[tox]
requires = tox>=4
env_list = py314, docs, lint

[testenv]
package = editable

[testenv:py314]
description = Run numerical examples on Python 3.14
set_env =
    MPLBACKEND = Agg
commands =
    python tools/run_examples.py

[testenv:docs]
description = Build Sphinx HTML documentation
deps = -r docs/requirements.txt
commands =
    sphinx-build -E -W -b html docs docs/_build

[testenv:lint]
description = Check Python and documentation style
package = skip
deps = -r test-requirements.txt
commands =
    flake8
    doc8

[doc8]
ignore = D000,D002,D004
ignore-path = .git,.tox,.venv,docs/_build,*.egg-info

[flake8]
exclude = .git,.tox,.venv,build,docs,*.egg-info
